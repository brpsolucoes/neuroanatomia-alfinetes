<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neuroanatomia · Alfinetes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d6b66'/%3E%3Ccircle cx='19' cy='12' r='7' fill='%23fff'/%3E%3Cpath d='M14 17 6 26' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="description" content="Estudo interativo de neuroanatomia com mapa de alfinetes: nome, função, imagem e localização de cada estrutura do roteiro de aula prática.">
<style>
:root{
  --bg:#f4f1ea; --surface:#ffffff; --surface-2:#faf8f3; --ink:#1c2230; --muted:#5b6578; --line:#e2ddd0;
  --accent:#0d6b66; --accent-ink:#ffffff; --accent-soft:#dcefed; --focus:#1d6fe0;
  --ok:#2b8a3e; --ok-soft:#e1f3e5; --warn:#b4600a; --warn-soft:#fbead6; --bad:#c2352e; --bad-soft:#fbe4e2;
  --map-bg:#ffffff; --shadow:0 1px 2px rgba(25,30,45,.06),0 10px 30px rgba(25,30,45,.08);
  --radius:14px; --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#181e28; --surface-2:#1e2531; --ink:#e8ecf4; --muted:#9aa5ba; --line:#2b3445;
  --accent:#41c7bb; --accent-ink:#06221f; --accent-soft:#143532; --focus:#6aa7ff;
  --ok:#5cc177; --ok-soft:#14301d; --warn:#f0a13d; --warn-soft:#3a2a12; --bad:#ff7d73; --bad-soft:#3b1b19;
  --map-bg:#0b0e13; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f131a; --surface:#181e28; --surface-2:#1e2531; --ink:#e8ecf4; --muted:#9aa5ba; --line:#2b3445;
    --accent:#41c7bb; --accent-ink:#06221f; --accent-soft:#143532; --focus:#6aa7ff;
    --ok:#5cc177; --ok-soft:#14301d; --warn:#f0a13d; --warn-soft:#3a2a12; --bad:#ff7d73; --bad-soft:#3b1b19;
    --map-bg:#0b0e13; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}

/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1380px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
a.brand{color:inherit;text-decoration:none}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand-mark svg{width:22px;height:22px}
.brand b{display:block;font-family:var(--serif);font-size:1.12rem;line-height:1.1;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:.74rem;line-height:1.2;margin-top:2px}
.tabs{display:flex;gap:4px;margin-left:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{border:0;background:none;padding:7px 14px;border-radius:9px;display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:600;font-size:.94rem}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab:hover{color:var(--ink)}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:.84rem;font-weight:600;color:var(--muted);line-height:1.2;text-align:left}
.seg button small{display:block;font-weight:500;opacity:.8;font-size:.72rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.prog{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);line-height:1.15}
.prog b{display:block;color:var(--ink);font-size:.95rem}
.ring{width:34px;height:34px;flex:none}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--ok);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .4s}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--ink);border-color:var(--muted)}

main{max-width:1380px;margin:0 auto;padding:20px 20px 80px}
.foot{max-width:1380px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:.82rem}
.foot button{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0}

/* ---------- genéricos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 15px;border-radius:11px;font-weight:600;font-size:.94rem;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.ghost{background:none}
.btn.sm{padding:5px 11px;min-height:34px;font-size:.86rem;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--g,#666) 14%,transparent);color:var(--g-ink,var(--ink));border:1px solid color-mix(in srgb,var(--g,#666) 40%,transparent);line-height:1.4}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--g,#666)}
.tag.plain{--g:#6b7587;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.hint{font-size:.84rem;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- mapa ---------- */
.mapa{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(360px,1fr);gap:20px;align-items:start}
.mapa-left{position:sticky;top:76px;min-width:0}
.mapchips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:thin}
.mapchips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:.86rem;font-weight:600;color:var(--muted);white-space:nowrap}
.mapchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mapchips button small{opacity:.7;margin-left:5px;font-weight:600}
.mapview{position:relative}
.viewport{position:relative;height:var(--vh,min(72vh,700px));background:var(--map-bg);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.viewport.drag{cursor:grabbing}
.viewport.pick{cursor:crosshair}
.viewport.static{cursor:default;touch-action:auto}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.stage.anim{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.stage img.base{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
:root[data-theme="dark"] .stage img.base{filter:brightness(.86) contrast(1.03)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stage img.base{filter:brightness(.86) contrast(1.03)}}
.area{position:absolute;inset:0;pointer-events:none;background:var(--g,#e33);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;animation:fadein .35s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.zoombar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:8}
.zoombar button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.zoombar button:hover{border-color:var(--muted)}
.maphint{position:absolute;left:10px;bottom:10px;z-index:8;font-size:.76rem;background:color-mix(in srgb,var(--surface) 90%,transparent);color:var(--muted);padding:4px 10px;border-radius:99px;border:1px solid var(--line);pointer-events:none}
.mapnote{margin-top:10px;font-size:.88rem;color:var(--muted)}

.pin{position:absolute;width:0;height:0;padding:0;margin:0;border:0;background:none;z-index:3;
  transform:scale(calc(1 / var(--s,1)));transform-origin:0 0;--len:32px;--c:var(--g,#d33);-webkit-tap-highlight-color:transparent}
.pin .arm{position:absolute;left:0;top:0;width:0;height:0;transform:rotate(var(--ang,0deg));transform-origin:0 0;pointer-events:none}
.pin .needle{position:absolute;left:-1px;top:calc(var(--len) * -1);width:2px;height:var(--len);background:#1b1f2a;box-shadow:0 0 0 1px rgba(255,255,255,.92);border-radius:2px}
.pin .head{position:absolute;left:-15px;top:calc(var(--len) * -1 - 15px);width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;
  font:800 12.5px/26px var(--sans);text-align:center;border:2px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.42);pointer-events:auto;cursor:pointer;
  transform:rotate(calc(var(--ang,0deg) * -1));transition:transform .15s,box-shadow .15s,opacity .15s;letter-spacing:-.2px}
.pin .tip{position:absolute;left:-4.5px;top:-4.5px;width:9px;height:9px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);pointer-events:none}
.pin:hover,.pin.hot{z-index:7}
.pin:hover .head,.pin.hot .head,.pin:focus-visible .head{transform:rotate(calc(var(--ang,0deg) * -1)) scale(1.2)}
.pin:focus-visible{outline:none}
.pin:focus-visible .head{outline:3px solid var(--focus);outline-offset:2px}
.pin.sel{z-index:9}
.pin.sel .head{transform:rotate(calc(var(--ang,0deg) * -1)) scale(1.3);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 38%,transparent),0 3px 10px rgba(0,0,0,.5)}
.pin.sel .tip::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--c);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.9);opacity:0}}
.mapview.has-sel .pin:not(.sel):not(.hot):not(:hover){opacity:.62}
.pin[data-st="dom"] .head::after,.pin[data-st="rev"] .head::after{content:"";position:absolute;right:-7px;top:-7px;width:14px;height:14px;border-radius:50%;border:2px solid #fff;font:700 9px/10px var(--sans);color:#fff;text-align:center}
.pin[data-st="dom"] .head::after{background:var(--ok);content:"✓"}
.pin[data-st="rev"] .head::after{background:var(--warn);content:"!"}
.pin.ghost{pointer-events:none}
.guess{position:absolute;width:0;height:0;z-index:6;transform:scale(calc(1 / var(--s,1)));transform-origin:0 0}
.guess::before,.guess::after{content:"";position:absolute;left:-11px;top:-2px;width:22px;height:4px;background:#e23b3b;border-radius:2px;box-shadow:0 0 0 1.5px #fff}
.guess::before{transform:rotate(45deg)} .guess::after{transform:rotate(-45deg)}
.guess.ok::before,.guess.ok::after{background:var(--ok)}

/* ---------- painel / detalhe ---------- */
.panel{min-width:0;scroll-margin-top:84px}
.panel-empty{padding:22px}
.panel-empty h3{font-family:var(--serif);font-size:1.25rem;margin-bottom:6px}
.pinlist{display:grid;gap:6px;margin-top:14px}
.pinrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:8px 10px;min-height:44px}
.pinrow:hover,.pinrow:focus-visible{border-color:var(--g,#888);background:color-mix(in srgb,var(--g,#888) 8%,var(--surface))}
.pinrow .n{width:28px;height:28px;border-radius:50%;background:var(--g,#888);color:#fff;font-weight:800;font-size:.78rem;display:grid;place-items:center;flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--g,#888)}
.pinrow .t{font-weight:600;line-height:1.25}
.pinrow .s{margin-left:auto;font-size:.8rem;font-weight:700}
.pinrow .s.dom{color:var(--ok)} .pinrow .s.rev{color:var(--warn)}

.detail{padding:20px 20px 22px;--gx:var(--g,#0d6b66)}
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dnav .sp{flex:1}
.dhead{display:flex;gap:14px;align-items:flex-start}
.badge{flex:none;width:52px;height:52px;border-radius:50%;background:var(--gx);color:#fff;font:800 1.2rem/1 var(--sans);display:grid;place-items:center;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--gx),0 4px 12px rgba(0,0,0,.25)}
.dname{font-family:var(--serif);font-size:1.7rem;line-height:1.12;font-weight:700;letter-spacing:.1px}
.dmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.steps{margin-top:18px;position:relative}
.step{position:relative;padding:0 0 18px 46px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .num{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);color:var(--muted);font-weight:800;font-size:.86rem;display:grid;place-items:center}
.step.on .num{background:var(--gx);border-color:var(--gx);color:#fff}
.step h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;line-height:32px}
.step.on h3{color:var(--gx)}
.step-body{margin-top:2px}
.fn li{position:relative;padding-left:18px;margin:0 0 8px;line-height:1.5}
.fn li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--gx)}
.onde p{margin:0 0 10px;line-height:1.55}
.locked{display:flex;align-items:center;gap:12px;width:100%;border:2px dashed var(--line);background:var(--surface-2);border-radius:12px;padding:14px 14px;color:var(--muted);text-align:left;min-height:56px}
.locked:not([disabled]):hover{border-color:var(--gx);color:var(--ink)}
.locked[disabled]{cursor:default;opacity:.7}
.locked .bars{flex:1;display:grid;gap:6px}
.locked .bars i{display:block;height:8px;border-radius:4px;background:color-mix(in srgb,var(--muted) 24%,transparent)}
.locked .bars i:nth-child(2){width:72%} .locked .bars i:nth-child(3){width:48%}
.locked b{white-space:nowrap;color:var(--gx)}
.extra{margin-top:18px;border:1px solid var(--line);border-left:4px solid var(--gx);border-radius:10px;background:var(--surface-2);padding:12px 14px;display:grid;gap:8px;font-size:.93rem}
.extra b{color:var(--gx);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;display:block}
.src{margin-top:12px;font-size:.78rem;color:var(--muted)}

.gal-main{display:block;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0;overflow:hidden;position:relative}
.gal-main img{display:block;width:100%;max-height:min(46vh,420px);object-fit:contain;background:#fff}
.gal-main .zoom{position:absolute;right:8px;top:8px;background:rgba(20,24,32,.72);color:#fff;border-radius:8px;padding:4px 8px;font-size:.76rem;display:flex;gap:5px;align-items:center}
.gal-cap{font-size:.84rem;color:var(--muted);margin-top:6px}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.thumbs button{flex:none;width:68px;height:52px;border:2px solid var(--line);border-radius:9px;background:#fff;padding:0;overflow:hidden;opacity:.8}
.thumbs button img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button[aria-pressed="true"]{border-color:var(--gx);opacity:1}
.minimap{margin:10px 0 0}
.minimap .viewport{height:260px}
.minimap .vsw{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.minimap .vsw button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:3px 11px;font-size:.8rem;font-weight:600;color:var(--muted)}
.minimap .vsw button[aria-pressed="true"]{background:var(--gx);border-color:var(--gx);color:#fff}
.dfoot{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- estudar ---------- */
.study{max-width:860px;margin:0 auto}
.study-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.study-bar .grow{flex:1;min-width:180px}
.progbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.progbar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px}
.chk{display:inline-flex;gap:7px;align-items:center;font-size:.9rem;color:var(--muted);font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.flow{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.flow span{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:700;color:var(--muted);padding:5px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.flow span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.flow span.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.flow em{font-style:normal;width:18px;height:18px;border-radius:50%;background:color-mix(in srgb,currentColor 18%,transparent);display:grid;place-items:center;font-size:.72rem}
.study-actions{position:sticky;bottom:0;z-index:12;margin-top:14px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.study-actions .btn{flex:1 1 150px;max-width:260px}
.kbd{font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface-2);color:var(--muted);margin-left:4px}
.empty{padding:34px 22px;text-align:center}
.empty h3{font-family:var(--serif);font-size:1.3rem;margin-bottom:6px}

/* ---------- prova ---------- */
.quiz{max-width:1100px;margin:0 auto}
.setup{padding:22px;display:grid;gap:18px;max-width:720px;margin:0 auto}
.setup h2{font-family:var(--serif);font-size:1.5rem}
.modes{display:grid;gap:10px}
.mode{display:flex;gap:12px;text-align:left;border:2px solid var(--line);background:var(--surface-2);border-radius:13px;padding:13px 14px;align-items:flex-start}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode .mi{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none}
.mode b{display:block}
.mode span{font-size:.87rem;color:var(--muted)}
.qwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:18px;align-items:start}
.qside{padding:18px;display:grid;gap:14px}
.qcount{display:flex;justify-content:space-between;align-items:center;font-size:.86rem;color:var(--muted);font-weight:700}
.qtitle{font-family:var(--serif);font-size:1.35rem;line-height:1.25}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 13px;font-weight:600;min-height:50px}
.opt:hover:not([disabled]){border-color:var(--accent)}

/* ---------- simulado ---------- */

/* ---------- lista ---------- */

<script>
(()=>{
"use strict";
const DATA = JSON.parse(document.getElementById('dados').textContent);
const IMG = JSON.parse(document.getElementById('imgs').textContent);
const GROUPS = DATA.groups, MAPS = DATA.maps, ALL = DATA.structs;
const BYID = Object.fromEntries(ALL.map(s=>[s.id,s]));
{ const hb=document.getElementById('homebrand'), hl=document.getElementById('homelink'); if(hb) hb.setAttribute('href',DATA.home||'#'); if(hl) hl.setAttribute('href',DATA.home||'#'); }

/* ---------- utilidades ---------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='style') el.setAttribute('style',v);
    else if(k==='html') el.innerHTML=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='value'||k==='checked'||k==='disabled'||k==='hidden'||k==='src'||k==='alt'||k==='id'||k==='type'||k==='placeholder'||k==='title'||k==='selected') el[k]=v;
    else el.setAttribute(k,v===true?'':v);
  }
  for(const kid of kids.flat(Infinity)){ if(kid==null||kid===false) continue; el.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return el;
}
const ICONS = {
  pin:'<circle cx="14.5" cy="8.5" r="5.5"/><path d="M10.6 12.4 3.5 20.5"/>',
  cards:'<rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v11"/>',
  quiz:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
  reset:'<path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  right:'<path d="M5 12h14M13 6l6 6-6 6"/>', left:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  shuffle:'<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
  expand:'<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',
  map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  redo:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>'
};
function icon(n){ const s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('class','i'); s.setAttribute('aria-hidden','true'); s.innerHTML=ICONS[n]||''; return s; }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcolor=s=>GROUPS[s.grupo].cor;
const mapOfArea = k => ({a_sag:'sagital',a_cor:'coronal',a_lob:'lobos'})[k.slice(0,5)];

/* ---------- estado e persistência ---------- */
const KEY='neuroAlfinetes.v1';
const st = { tab:'mapa', roteiro:2, mapId:'sagital', sel:null, recall:false, status:{}, srs:{}, theme:'auto' };
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)||'{}'); if(d.roteiro) st.roteiro=d.roteiro; if(d.status) st.status=d.status; if(d.srs) st.srs=d.srs; if(d.theme) st.theme=d.theme; if(typeof d.recall==='boolean') st.recall=d.recall; }catch(e){} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({roteiro:st.roteiro,status:st.status,srs:st.srs,theme:st.theme,recall:st.recall})); }catch(e){} }
const visible = () => ALL.filter(s => st.roteiro===2 || s.id<=28);
const isVis = s => st.roteiro===2 || s.id<=28;
function setStatus(id,v){ if(v) st.status[id]=v; else delete st.status[id]; if(v==='dom') srsAcerto(id); else if(v==='rev') srsErro(id); else delete st.srs[id]; save(); renderHeader(); }
/* ---------- revisão espaçada (caixas de Leitner) ----------
   acerto: sobe uma caixa e volta em 1, 3, 7, 14 ou 30 dias; erro: caixa 1, volta amanhã.
   Acertar antes do dia marcado não adianta a agenda. */
const INTERVALOS=[0,1,3,7,14,30];
const dataStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoje=()=>dataStr(new Date());
const emDias=n=>{ const d=new Date(); d.setDate(d.getDate()+n); return dataStr(d); };
function diasAte(due){ const [y,m,d]=due.split('-').map(Number); const a=new Date(y,m-1,d), b=new Date(); b.setHours(0,0,0,0); return Math.round((a-b)/86400000); }
function srsAcerto(id){ const r=st.srs[id]; if(r&&r.due>hoje()) return; const box=Math.min(5,(r?r.box:0)+1); st.srs[id]={box,due:emDias(INTERVALOS[box])}; }
function srsErro(id){ st.srs[id]={box:1,due:emDias(1)}; }
function srsAcertoSalvar(id){ srsAcerto(id); save(); renderHeader(); }
const vence=id=>{ const r=st.srs[id]; return r?r.due<=hoje():st.status[id]==='rev'; };
const paraHoje=()=>visible().filter(x=>vence(x.id));
function resumoRevisao(){
  const v=visible(); const due=v.filter(x=>vence(x.id)).length, novos=v.filter(x=>!st.srs[x.id]&&!st.status[x.id]).length;
  const semana=v.filter(x=>{ const r=st.srs[x.id]; if(!r) return false; const n=diasAte(r.due); return n>=1&&n<=7; }).length;
  let prox=null; for(const x of v){ const r=st.srs[x.id]; if(r&&r.due>hoje()&&(!prox||r.due<prox)) prox=r.due; }
  return {due,novos,semana,prox,proxN:prox?v.filter(x=>st.srs[x.id]&&st.srs[x.id].due===prox).length:0};
}
function quandoTxt(due){ const n=diasAte(due); const [,m,d]=due.split('-'); return n<=0?'hoje':n===1?'amanhã':`em ${n} dias (${d}/${m})`; }
function textoRevisao(id){ const r=st.srs[id]; if(!r) return st.status[id]==='rev'?'Próxima revisão: hoje':'Ainda fora da agenda de revisão (entra quando você marcar ou responder)'; return `Próxima revisão: ${quandoTxt(r.due)} · caixa ${r.box} de 5`; }
function migrarSrs(){ for(const [id,v] of Object.entries(st.status)){ if(st.srs[id]) continue; st.srs[id]=v==='dom'?{box:2,due:emDias(3)}:{box:1,due:hoje()}; } }


/* ---------- MapView: imagem + alfinetes + zoom/arrasto ---------- */
class MapView{
  constructor(host, mapId, o={}){
    this.o=o; this.host=host; this.mapId=mapId; this.m=MAPS[mapId];
    this.size=DATA.sizes[this.m.img]; this.s=1; this.tx=0; this.ty=0; this.pinEls=new Map(); this.areaEls=[]; this.moved=false; this.ptrs=new Map();
    this.view=h('div',{class:'viewport'+(o.static?' static':'')+(o.pick?' pick':'')});
    this.stage=h('div',{class:'stage'});
    this.base=h('img',{class:'base',src:IMG[this.m.img],alt:this.m.nome+' (imagem de base do mapa)'});
    this.stage.append(this.base); this.view.append(this.stage);
    this.root=h('div',{class:'mapview'},this.view);
    if(!o.static){
      this.root.append(h('div',{class:'zoombar'},
        h('button',{type:'button','aria-label':'Aproximar',onclick:()=>this.zoomBy(1.5)},icon('plus')),
        h('button',{type:'button','aria-label':'Afastar',onclick:()=>this.zoomBy(1/1.5)},icon('minus')),
        h('button',{type:'button','aria-label':'Ver mapa inteiro',onclick:()=>this.reset(true)},icon('reset'))));
      this.root.append(h('div',{class:'maphint'},'Roda do mouse ou pinça = zoom · arraste para mover'));
      this.bind();
    }
    host.replaceChildren(this.root);
    this.ro=new ResizeObserver(()=>this.fit()); this.ro.observe(this.view);
    this.fit();
  }
  destroy(){ this.ro&&this.ro.disconnect(); }
  fit(){
    const vw0=this.view.clientWidth; if(!vw0) return;
    const [iw,ih]=this.size;
    if(!this.o.static){
      const maxH=innerWidth<=1020?(this.o.compact?Math.min(innerHeight*0.42,380):Math.min(innerHeight*0.6,540)):Math.min(innerHeight*0.74,720);
      const hh=Math.round(clamp(vw0*ih/iw,240,maxH)); if(this.view.style.height!==hh+'px') this.view.style.height=hh+'px';
    }
    const vw=this.view.clientWidth, vh=this.view.clientHeight; if(!vw||!vh) return;
    const k=Math.min(vw/iw,vh/ih);
    const first=!this.fw; this.vw=vw; this.vh=vh; this.fw=iw*k; this.fh=ih*k;
    this.stage.style.width=this.fw+'px'; this.stage.style.height=this.fh+'px';
    if(first && this.pendingFocus){ const f=this.pendingFocus; this.pendingFocus=null; this.focusPoint(f.x,f.y,f.z,false); }
    else this.apply(false);
  }
  clampT(){
    const cw=this.fw*this.s, ch=this.fh*this.s;
    this.tx = cw<=this.vw ? (this.vw-cw)/2 : clamp(this.tx,this.vw-cw,0);
    this.ty = ch<=this.vh ? (this.vh-ch)/2 : clamp(this.ty,this.vh-ch,0);
  }
  apply(anim){
    this.clampT();
    this.stage.classList.toggle('anim',!!anim);
    this.stage.style.setProperty('--s',this.s);
    this.stage.style.transform=`translate(${this.tx}px,${this.ty}px) scale(${this.s})`;
    if(this._ls!==this.s||this._lfw!==this.fw){ this._ls=this.s; this._lfw=this.fw; this.layoutPins(); }
  }
  /* Afasta as cabeças dos alfinetes para não se sobreporem (a ponta fica sempre no lugar). */
  layoutPins(){
    const els=[...this.pinEls.values()]; if(els.length<2||!this.fw) return;
    const head=els[0].querySelector('.head'); const R=(head&&head.offsetWidth||30)/2, D=2*R+3;
    const L0=matchMedia('(max-width:760px)').matches?27:32;
    const W=this.fw*this.s, H=this.fh*this.s;
    const tips=els.map(el=>({x:el._p.x*W,y:el._p.y*H}));
    const deltas=[0,20,-20,40,-40,60,-60,80,-80,100,-100,120,-120,140,-140,160,-160,180];
    const placed=[];
    els.forEach((el,i)=>{
      const p=el._p, t=tips[i]; let best=null, bestScore=-Infinity;
      for(const mult of [1,1.5,2]){
        for(const d of deltas){
          const a=(p.ang||0)+d, rad=a*Math.PI/180, L=L0*mult;
          const hx=t.x+L*Math.sin(rad), hy=t.y-L*Math.cos(rad);
          let folga=Math.min(hx-R,hy-R,W-hx-R,H-hy-R);
          for(const q of placed) folga=Math.min(folga,Math.hypot(hx-q.x,hy-q.y)-D);

  const mv=new MapView(left,p.mapa,{compact:true});
  mv.setPins([{id:s.id,x:p.x,y:p.y,ang:p.ang,label:n,color:PIN_NEUTRO}]); mv.select(s.id); mv.focusPoint(p.x,p.y,p.mapa==='sagital'?1.8:1.3,false); curMap=mv;
  left.append(h('p',{class:'mapnote'},'Amplie e arraste o mapa se precisar.'));
  const timeEl=h('span',{class:'timer','aria-live':'off'}); const barI=h('i'); const bar=h('div',{class:'tbar','aria-hidden':'true'},barI);
  const inp=h('input',{type:'text',class:'simin',placeholder:'Nome da estrutura','aria-label':`Nome da estrutura do alfinete ${n}`,autocomplete:'off',autocapitalize:'off',autocorrect:'off',spellcheck:'false',enterkeyhint:'next'});
  const fb=h('div',{}); let feito=false;
  const avancar=()=>{ sim.i++; renderProva(); window.scrollTo({top:0}); };
  const responder=(esgotou)=>{
    if(feito) return; feito=true; clearInterval(simTimer);
    const r=corrigir(s.id,inp.value);
    sim.ans.push({id:s.id,place:p,txt:inp.value.trim(),...r,esgotou:!!esgotou,aceita:false});
    if(sim.corr==='cada'){
      inp.disabled=true; botoes.hidden=true;
      mv.setAreas((s.areas||{})[p.mapa]||[],gcolor(s));
      const prox=h('button',{type:'button',class:'btn primary',onclick:avancar},n>=N?'Ver resultado':'Próximo alfinete',icon('right'));
      const titulo=r.ok?'Certo!':(r.branco?(esgotou?'Tempo esgotado.':'Em branco.'):r.inc?'Incompleta.':'Errado.');
      const extra=r.ok&&normAns(inp.value)!==normAns(s.nome)?` (aceito: “${inp.value.trim()}”)`:'';
      fb.replaceChildren(h('div',{class:'fb '+(r.ok?'ok':r.inc?'near':'bad')},titulo,h('small',{},`Alfinete ${n}: ${s.nome}${extra}`)),prox);
      prox.focus();
    } else avancar();
  };
  const botoes=h('div',{class:'row'},
    h('button',{type:'button',class:'btn primary',onclick:()=>responder(false)},'Responder',h('span',{class:'kbd'},'Enter')),
    h('button',{type:'button',class:'btn ghost',onclick:()=>{ inp.value=''; responder(false); }},'Pular'));
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); responder(false); } });
  side.append(
    h('div',{class:'qcount'},h('span',{},`Alfinete ${n} de ${N}`),sim.tempo?timeEl:h('span',{},'Sem limite de tempo')),
    sim.tempo?bar:null,
    h('h2',{class:'qtitle'},`Qual é a estrutura do alfinete ${n}?`),
    inp,botoes,fb,
    h('p',{class:'hint'},'Acentos, maiúsculas e pequenos erros de digitação não contam. '+(sim.corr==='fim'?'A correção aparece no final, como na prova.':'Você vê a correção a cada alfinete.')),
    h('div',{class:'row'},h('button',{type:'button',class:'btn ghost sm',onclick:()=>{
      if(!confirm('Encerrar o simulado agora? Os alfinetes que faltam contam como em branco.')) return;
      clearInterval(simTimer);
      for(let j=feito?sim.i+1:sim.i;j<sim.items.length;j++){ const x=sim.items[j]; sim.ans.push({id:x.id,place:x.place,txt:'',ok:false,branco:true,inc:false,esgotou:false,aceita:false}); }
      sim.i=sim.items.length; renderProva(); window.scrollTo({top:0}); }},'Encerrar simulado')));
  if(sim.tempo){
    const t0=Date.now(), T=sim.tempo*1000;
    const tick=()=>{ const resta=Math.max(0,T-(Date.now()-t0)); const sec=Math.ceil(resta/1000);
      timeEl.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; timeEl.classList.toggle('low',sec<=10); barI.style.width=(resta/T*100)+'%';
      if(resta<=0) responder(true); };
    tick(); simTimer=setInterval(tick,200);
  }
  if(matchMedia('(pointer:fine)').matches) setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(_){ inp.focus(); } },60);
}
function simResult(view){
  clearInterval(simTimer);
  if(!sim.fim) sim.fim=Date.now();
  if(!sim.marcados){ sim.marcados=true; for(const a of sim.ans){ if(a.ok){ srsAcerto(a.id); continue; } a.antes=st.status[a.id]||null; a.antesSrs=st.srs[a.id]?{...st.srs[a.id]}:null; setStatus(a.id,'rev'); a.marcou=true; } save(); renderHeader(); }
  const box=h('div',{class:'card result'});
  const draw=()=>{
    const N=sim.ans.length, certos=sim.ans.filter(a=>a.ok||a.aceita).length, pct=N?Math.round(certos/N*100):0;
    const dur=Math.round((sim.fim-sim.t0)/1000), erros=sim.ans.filter(a=>!(a.ok||a.aceita));
    box.replaceChildren(h('p',{class:'muted'},'Resultado do simulado'),h('div',{class:'score'},`${certos}/${N}`),h('p',{},`${pct}% de acertos`),
      h('div',{class:'simsum'},h('span',{},`Tempo total: ${Math.floor(dur/60)} min ${dur%60} s`),h('span',{},sim.tempo?`${sim.tempo} s por alfinete`:'Sem limite de tempo')),
      erros.length?h('p',{class:'hint',style:'margin-top:10px'},'Os erros foram marcados como “para revisar”. Se a correção automática recusou uma resposta que você considera certa, use “Contar como certa”.'):h('p',{class:'fb ok',style:'margin:16px 0 0'},'Gabaritou! Excelente.'),
      h('div',{class:'simlist'},sim.ans.map((a,k)=>{ const s=BYID[a.id], ok=a.ok||a.aceita;
        return h('div',{class:'simrow'+(ok?' ok':'')},
          h('span',{class:'n',style:`--g:${gcolor(s)}`,'aria-label':`Alfinete ${k+1}`},String(k+1)),
          h('div',{class:'simtx'},h('b',{},s.nome),h('small',{},a.txt?`Você escreveu: “${a.txt}”`:(a.esgotou?'Tempo esgotado (em branco)':'Em branco')),
            (!ok&&a.inc)?h('small',{class:'inc'},'Resposta incompleta'):null),
          h('span',{class:'simst'},ok?(a.aceita?'✓ aceita':'✓ certa'):'✗ errada'),
          h('div',{class:'row'},h('button',{type:'button',class:'btn sm',onclick:()=>openDetailModal(a.id)},'Ver no app'),
            !a.ok?h('button',{type:'button',class:'btn sm ghost',onclick:()=>{ a.aceita=!a.aceita; if(a.marcou){ if(a.aceita){ setStatus(a.id,a.antes); if(a.antesSrs) st.srs[a.id]={...a.antesSrs}; else delete st.srs[a.id]; srsAcertoSalvar(a.id); } else setStatus(a.id,'rev'); } draw(); }},a.aceita?'Desfazer':'Contar como certa'):null)); })),
      h('div',{class:'row',style:'justify-content:center'},
        erros.length?h('button',{type:'button',class:'btn primary',onclick:()=>startSim(erros.map(a=>a.id))},icon('redo'),'Refazer só os erros'):null,
        h('button',{type:'button',class:erros.length?'btn':'btn primary',onclick:()=>{ sim=null; renderProva(); }},icon('flag'),'Novo simulado'),
        erros.length?h('button',{type:'button',class:'btn',onclick:()=>{ sim=null; deck.filter='rev'; deck.built=false; st.tab='estudar'; renderAll(); }},icon('cards'),'Estudar os erros'):null));
  };
  draw(); view.replaceChildren(h('div',{class:'quiz'},box));
}

/* ---------- aba LISTA ---------- */
const lf={q:'',g:null,s:'todos'};
function renderLista(){
  const view=document.getElementById('view');
  const norm=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const grid=h('div',{class:'grid'});
  const draw=()=>{
    const q=norm(lf.q.trim());
    const l=visible().filter(s=>(!lf.g||s.grupo===lf.g)&&(lf.s==='todos'||(lf.s==='dom'?st.status[s.id]==='dom':lf.s==='rev'?st.status[s.id]==='rev':!st.status[s.id]))&&(!q||norm(s.nome).includes(q)||String(s.id)===q||norm(GROUPS[s.grupo].nome).includes(q)));
    grid.replaceChildren(...l.map(s=>{ const stt=st.status[s.id]; return h('button',{type:'button',class:'lcard',style:`--g:${gcolor(s)}`,onclick:()=>openDetailModal(s.id)},h('span',{class:'n'},String(s.id)),h('span',{},h('b',{},s.nome),h('small',{},GROUPS[s.grupo].nome)),stt&&h('span',{class:'st '+stt},stt==='dom'?'✓':'!')); }));
    if(!l.length) grid.append(h('p',{class:'muted'},'Nenhuma estrutura encontrada.'));
    cnt.textContent=`${l.length} de ${visible().length}`;
  };
  const cnt=h('span',{class:'hint'});
  const bar=h('div',{class:'lista-bar'},h('input',{type:'search',placeholder:'Buscar por nome ou número…','aria-label':'Buscar',value:lf.q,oninput:e=>{ lf.q=e.target.value; draw(); }}),
    h('select',{'aria-label':'Status',onchange:e=>{ lf.s=e.target.value; draw(); }},[['todos','Todos'],['novo','Sem marcação'],['dom','Dominados'],['rev','Para revisar']].map(([v,t])=>h('option',{value:v,selected:v===lf.s},t))),cnt);
  const used=[...new Set(visible().map(s=>s.grupo))];
  const chips=h('div',{class:'gchips',role:'group','aria-label':'Filtrar por grupo'},used.map(g=>h('button',{type:'button','aria-pressed':String(lf.g===g),style:`--g:${GROUPS[g].cor}`,onclick:e=>{ lf.g=lf.g===g?null:g; [...chips.children].forEach((b,i)=>b.setAttribute('aria-pressed',String(lf.g===used[i]))); draw(); }},h('i'),GROUPS[g].nome)));
  view.replaceChildren(h('div',{},bar,chips,grid)); draw();
}

/* ---------- raiz ---------- */
function renderAll(){
  clearInterval(simTimer);
  renderHeader();
  curMap&&curMap.destroy(); curMap=null;
  ({mapa:renderMapa,estudar:renderEstudar,prova:renderProva,lista:renderLista})[st.tab]();
}
document.getElementById('themebtn').addEventListener('click',()=>{
  const dark=document.documentElement.dataset.theme==='dark'||(st.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
  st.theme=dark?'light':'dark'; applyTheme(); save(); renderHeader();
});
document.getElementById('aboutbtn').addEventListener('click',aboutModal);
load(); migrarSrs(); save(); applyTheme(); renderAll();
})();
</script>
